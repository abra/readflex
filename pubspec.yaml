name: readflex
description: "Mobile reading app with library, articles, and highlights"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

workspace:
  - packages/domain_models
  - packages/shared
  - packages/readflex_localizations
  - packages/monitoring
  - packages/native_text_selection
  - packages/component_library
  - packages/local_storage
  - packages/book_repository
  - packages/collection_repository
  - packages/bounded_http
  - packages/article_extraction_service
  - packages/remote_content_policy
  - packages/article_repository
  - packages/highlight_repository
  - third_party/fsrs
  - packages/review_scheduler
  - packages/fsrs_repository
  - packages/dictionary_repository
  - packages/preferences_service
  - packages/connectivity_service
  - packages/contextual_translation_service
  - packages/dictionary_service
  - third_party/device_screen_brightness
  - packages/screen_control_service
  - packages/pagecraft
  - packages/toast_service
  - packages/features/library
  - packages/features/import_flow
  - packages/features/highlight
  - packages/features/translate
  - packages/features/dictionary
  - packages/features/reader
  - packages/features/onboarding
  - packages/features/practice

dependencies:
  cupertino_ui: ^1.1.6
  material_ui: ^1.11.0
  flutter:
    sdk: flutter

  # Internal packages
  domain_models:
    path: packages/domain_models
  shared:
    path: packages/shared
  readflex_localizations:
    path: packages/readflex_localizations
  monitoring:
    path: packages/monitoring
  component_library:
    path: packages/component_library
  local_storage:
    path: packages/local_storage
  book_repository:
    path: packages/book_repository
  collection_repository:
    path: packages/collection_repository
  article_extraction_service:
    path: packages/article_extraction_service
  article_repository:
    path: packages/article_repository
  highlight_repository:
    path: packages/highlight_repository
  dictionary_repository:
    path: packages/dictionary_repository
  fsrs_repository:
    path: packages/fsrs_repository
  connectivity_service:
    path: packages/connectivity_service
  contextual_translation_service:
    path: packages/contextual_translation_service
  dictionary_service:
    path: packages/dictionary_service
  screen_control_service:
    path: packages/screen_control_service
  preferences_service:
    path: packages/preferences_service
  toast_service:
    path: packages/toast_service

  # Feature packages
  library_feature:
    path: packages/features/library
  import_flow:
    path: packages/features/import_flow
  highlight:
    path: packages/features/highlight
  translate:
    path: packages/features/translate
  dictionary:
    path: packages/features/dictionary
  reader:
    path: packages/features/reader
  onboarding:
    path: packages/features/onboarding
  practice:
    path: packages/features/practice

  # External packages
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  go_router: ^18.1.4
  url_launcher: ^6.3.1
  path: ^1.9.0
  path_provider: ^2.1.6

dev_dependencies:
  analyzer: ^14.7.0
  archive: ^4.5.0
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  pagecraft:
    path: packages/pagecraft
  native_text_selection:
    path: packages/native_text_selection

  bloc_test: ^10.0.0
  coverage: ^1.15.0
  drift: ^2.34.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.4.2
  shared_preferences_platform_interface: ^2.4.1
  test: ^1.31.0
  yaml: ^3.1.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Fonts live physically inside packages/component_library/fonts/ but must
  # be declared here at the APP level to be bundled into the built app and
  # reachable by their short family name. Flutter does not auto-bundle fonts
  # declared only in a package's pubspec.yaml — without this section reader/UI
  # font families silently fall back to platform defaults.
  fonts:
    - family: Noto Sans Symbols
      fonts:
        - asset: packages/component_library/fonts/NotoSansSymbols-Regular.ttf
    - family: Noto Sans Phonetics
      fonts:
        - asset: packages/component_library/fonts/NotoSans-Phonetics.ttf
    - family: Geist
      fonts:
        - asset: packages/component_library/fonts/Geist-Variable.ttf
    - family: Literata
      fonts:
        - asset: packages/component_library/fonts/Literata-Variable.ttf
        - asset: packages/component_library/fonts/Literata-Italic-Variable.ttf
          style: italic
    - family: PT Serif
      fonts:
        - asset: packages/component_library/fonts/PTSerif-Regular.ttf
        - asset: packages/component_library/fonts/PTSerif-Italic.ttf
          style: italic
        - asset: packages/component_library/fonts/PTSerif-Bold.ttf
          weight: 700
        - asset: packages/component_library/fonts/PTSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Open Sans
      fonts:
        - asset: packages/component_library/fonts/OpenSans-Variable.ttf
