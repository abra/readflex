name: pagecraft
description: Pagecraft, the native reader engine for Flutter — containers, formats, CFI, document model, layout, pagination and the reader view.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.1

dependencies:
  characters: ^1.4.1
  code_assets: ^1.2.1
  crypto: ^3.0.6
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  flutter_svg: ^2.3.2
  html: ^0.15.5
  image: ^4.3.0
  meta: ^1.16.0
  native_toolchain_c: 0.19.2
  native_text_selection:
    path: ../native_text_selection
  pdfium_dart: ^0.2.5
  pdfrx: ^2.4.8
  pdfrx_engine: ^0.4.7
  xml: ^6.5.0

dev_dependencies:
  archive: ^4.5.0
  ffigen: 20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  licenses:
    - native/djvu/upstream/COPYRIGHT
    - native/djvu/upstream/COPYING
