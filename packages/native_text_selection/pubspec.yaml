name: native_text_selection
description: Native iOS and Android selection controls for Flutter text geometry.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.1
  flutter: '>=3.44.0'

dependencies:
  characters: ^1.4.1
  flutter:
    sdk: flutter

dev_dependencies:
  material_ui: ^1.11.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.abra.native_text_selection
        pluginClass: NativeTextSelectionPlugin
      ios:
        pluginClass: NativeTextSelectionPlugin
