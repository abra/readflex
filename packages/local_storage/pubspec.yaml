name: local_storage
description: "Single Drift database shared by all repositories."
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0
  sqlite3: ^3.3.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Newer generator minors can emit APIs absent from the locked runtime.
  drift_dev: 2.34.6
  build_runner: ^2.15.0
