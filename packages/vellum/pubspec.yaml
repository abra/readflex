  flutter:
    sdk: flutter
  image: ^4.3.0
  meta: ^1.16.0
  pdfium_dart: ^0.2.5
  pdfrx: ^2.4.8
  pdfrx_engine: ^0.4.7

dev_dependencies:
  archive: ^4.5.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
