name: toast_service
description: "In-app toast notifications — thin wrapper over toastification. Swap the underlying library here without touching feature packages."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  material_ui: ^1.11.0
  flutter:
    sdk: flutter
  toastification: ^3.0.3

  component_library:
    path: ../component_library

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
