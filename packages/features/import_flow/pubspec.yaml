name: import_flow
description: Bottom sheet for importing book files and saving article URLs.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  material_ui: ^1.11.0
  flutter:
    sdk: flutter

  equatable: ^2.0.8
  file_picker: ^11.0.2
  flutter_bloc: ^9.1.1
  path: ^1.9.0
  path_provider: ^2.1.6
  readflex_localizations:
    path: ../../readflex_localizations

  component_library:
    path: ../../component_library
  domain_models:
    path: ../../domain_models
  book_repository:
    path: ../../book_repository
  pagecraft:
    path: ../../pagecraft
  monitoring:
    path: ../../monitoring

dev_dependencies:
  cupertino_ui: ^1.1.6
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
