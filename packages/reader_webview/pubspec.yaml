name: reader_webview
description: "WebView reader widget backed by foliate-js."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  domain_models:
    path: ../domain_models
  flutter_inappwebview: ^6.1.5
  monitoring:
    path: ../monitoring
  path: ^1.9.1

