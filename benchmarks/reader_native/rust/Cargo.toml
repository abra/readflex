[package]
name = "vellum_reader_benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib"] }
flutter_rust_bridge = "=2.13.0"
xmlparser = "0.13.6"
html-escape = "0.2.13"
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = "thin"
strip = "debuginfo"
